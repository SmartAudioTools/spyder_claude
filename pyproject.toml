[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-claude"
version = "0.1.0"
description = "Les instances de Claude Code dans un dock Spyder : un onglet par instance, l'etat de chacune a l'oeil, mosaique quand le panneau est agrandi"
requires-python = ">=3.9"
# spyder-konsole : le moteur de terminal (konsole_view) vit dans ce greffon-la
# depuis le 09/08/2026 (il etait dans un paquet smartos-konsole a part du 31/07 au 08/08 -
# nom mal choisi, le moteur tient a KDE, pas a SmartOS). En monde pip la dependance se
# resout toute seule ; sur les machines SmartOS (installation cote a cote par
# install_spyder_plugin.py, sans resolveur), l'installateur du greffon pose le greffon
# Terminal en prerequis.
#
# ⚠ AUCUN LIEN entre les AFFICHAGES des deux greffons (depuis le 31/07/2026) : ni heritage,
# ni import de panneau. Le partage se limite au moteur — c'est precisement ce que
# l'utilisateur veut voir diverger.
dependencies = ["qtpy", "qtawesome", "spyder-konsole"]

# Le nom du point d'entree DOIT etre identique a l'attribut NAME de la classe, sinon
# Spyder leve une SpyderAPIError et ignore le greffon en silence.
[project.entry-points."spyder.plugins"]
claude_pane = "spyder_claude.spyder.plugin:GreffonClaude"

[tool.setuptools.packages.find]
include = ["spyder_claude*"]
